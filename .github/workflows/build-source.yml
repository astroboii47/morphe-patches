name: Build source bundle

on:
  workflow_dispatch:
  push:
    branches:
      - v43-phone-layout

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build patch bundle
        run: ./gradlew :patches:assemble
      - uses: actions/upload-artifact@v4
        with:
          name: patches-bundle
          path: patches/build/libs/patches-*.mpp
